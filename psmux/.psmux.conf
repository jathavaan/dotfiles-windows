# =========================================================================
#  GENERAL
# =========================================================================
set -sg escape-time 10          # no Esc lag in nvim, reliable Alt keys
set -g focus-events on          # lets nvim autoread detect file changes
set -g mouse on
set -g history-limit 10000
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"

# =========================================================================
#  PREFIX  Ctrl+a
# =========================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.psmux.conf \; display "Config reloaded"

# =========================================================================
#  THEME
#  Colour names (black/white/brightblack ...) resolve to Alacritty's current
#  palette, so the status bar follows the light/dark toggle with no reload.
#  The accent #817c9c is the selection colour, identical in both themes,
#  and is therefore hardcoded.
# =========================================================================
set -g mode-style "bg=#817c9c,fg=#edeef2"        # picker / copy-mode selection
set -g message-style "bg=black,fg=white"
set -g message-command-style "bg=black,fg=white"

set -g pane-active-border-style "fg=#817c9c"
set -g pane-border-hover-style "fg=#817c9c"

set -g cursor-style bar                           # matches nvim's cursor
set -g choose-tree-preview on                     # preview in prefix + w

# --- status bar ----------------------------------------------------------
set -g status-style "bg=black,fg=brightblack"
set -g status-justify left
set -g status-interval 15

set -g status-left "#[fg=#817c9c,bold] #S #[default]"
set -g status-left-length 30

set -g status-right "#[fg=brightblack]%H:%M "
set -g status-right-length 20

set -g window-status-format "#[fg=brightblack] #I #W "
set -g window-status-current-format "#[fg=#817c9c,bold] #I #W "
set -g window-status-activity-style "fg=#817c9c"

# =========================================================================
#  SESSION PICKER  prefix + w (choose-tree, psmux default)
#  The startup picker is fzf in $PROFILE; psmux pickers are client-side
#  overlays and can only be opened by a keypress.
# =========================================================================

# =========================================================================
#  PANE NAVIGATION  Alt+hjkl is handled by nvim / PowerShell (see $PROFILE)
#  Fallback: prefix + hjkl, repeatable
# =========================================================================
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# =========================================================================
#  PANE RESIZING  prefix + Shift+hjkl, repeatable
# =========================================================================
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =========================================================================
#  WINDOW MANAGEMENT  prefix + key
# =========================================================================
bind v split-window -h -c "#{pane_current_path}"   # split vertically (side by side)
bind s split-window -v -c "#{pane_current_path}"   # split horizontally (stacked)
bind q kill-pane                                   # close split
bind o kill-pane -a                                # close all other splits
bind e select-layout tiled                         # equalize
bind x swap-pane -D                                # swap with next
bind m resize-pane -Z                              # maximize (toggle)

# =========================================================================
#  WINDOWS (≈ buffers)  prefix + c / Tab / Shift+Tab
# =========================================================================
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window
